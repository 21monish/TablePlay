envVarGroups:
  - name: tableplay-core-secrets
    envVars:
      - key: APP_KEY
        sync: false
      - key: DB_URL
        sync: false
      - key: TABLEPLAY_SUPERADMIN_EMAIL
        sync: false
      - key: TABLEPLAY_SUPERADMIN_PASSWORD
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: TABLEPLAY_MEDIA_URL
        sync: false
  - name: tableplay-realtime-secrets
    envVars:
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false

services:
  - type: web
    name: tableplay-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit
    dockerCommand: /usr/local/bin/tableplay-web-start
    envVars:
      - fromGroup: tableplay-core-secrets
      - fromGroup: tableplay-realtime-secrets
      - key: APP_NAME
        value: TablePlay
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://tableplay-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "10080"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_HOST
        value: tableplay-realtime.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_PUBLIC_HOST
        value: tableplay-realtime.onrender.com
      - key: REVERB_PUBLIC_PORT
        value: "443"
      - key: REVERB_PUBLIC_SCHEME
        value: https
      - key: TABLEPLAY_MODE
        value: cloud
      - key: TABLEPLAY_CLOUD_CONSOLE
        value: "true"
      - key: TABLEPLAY_REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: TABLEPLAY_MEDIA_DRIVER
        value: s3
      - key: TABLEPLAY_UPDATES_DRIVER
        value: s3
      - key: SUPABASE_S3_REGION
        value: local
      - key: SUPABASE_MEDIA_BUCKET
        value: tableplay-media
      - key: SUPABASE_UPDATES_BUCKET
        value: tableplay-updates
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_FROM_NAME
        value: TablePlay

  - type: web
    name: tableplay-realtime
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan reverb:start --host=0.0.0.0 --port=$PORT
    autoDeployTrigger: commit
    envVars:
      - fromGroup: tableplay-realtime-secrets
      - key: APP_NAME
        value: TablePlay Realtime
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
      - key: REVERB_SERVER_PORT
        value: "10000"
      - key: REVERB_HOST
        value: tableplay-realtime.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
